<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ESP32 → Flask Demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; }
      h1 { margin: 0 0 12px; }
      img { width: 100%; max-width: 720px; border: 1px solid #ddd; border-radius: 10px; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; color:#555; }
    </style>
  </head>
  <body>
    <h1>ESP32 Stream via Flask</h1>
    <p class="mono">GET /video_feed</p>
    <img src="/video_feed" alt="ESP32 stream" />
    <p>
        <button onclick="window.open('/snapshot.jpg','_blank')"> Take Snapshot</button>
        <button onclick="saveSnap()"> Save Snapshot</button>
    </p>
    <script>
        async function saveSnap(){
        const res = await fetch('/snapshot-save');
        const data = await res.json();
        alert(data.ok ? ('Saved: ' + data.file) : ('Error: ' + data.error));
    }
    </script>
  </body>
</html>
